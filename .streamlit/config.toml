[client]
showSidebarNavigation = false
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#0052FF"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F6F8"
textColor = "#0A0B0D"
linkColor = "#0052FF"
borderColor = "#D8DCE3"
showWidgetBorder = true
showSidebarBorder = false
baseRadius = "4px"
buttonRadius = "full"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap"
baseFontSize = 15
headingFontSizes = ["4rem", "2rem", "1.45rem", "1.1rem", "1rem", ".9rem"]
headingFontWeights = [800, 700, 700, 650, 650, 650]
chartCategoricalColors = ["#0052FF", "#00A86B", "#FF7A00", "#7C3AED", "#E5484D", "#00A8E8", "#6B7280"]
redColor = "#D92D20"
orangeColor = "#D97706"
greenColor = "#11845B"
blueColor = "#0052FF"
violetColor = "#7C3AED"
grayColor = "#667085"
dataframeBorderColor = "#D8DCE3"
dataframeHeaderBackgroundColor = "#F4F6F8"
linkUnderline = false

[theme.sidebar]
primaryColor = "#FFFFFF"
backgroundColor = "#0052FF"
secondaryBackgroundColor = "#124EDE"
textColor = "#FFFFFF"
borderColor = "#2B68FF"

